<style>
:root{--primary:#1e40af;--primary-light:rgba(30,64,175,.07);--bg-main:#f5f7fb;--panel:#fff;

*{box-sizing:border-box}
body{margin:0;background:var(--bg-main);color:var(--ink);
font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 40px}
h1{font-size:19px;margin:0 0 4px}
.sub{font-size:12.5px;color:var(--text-secondary);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.card h2{font-size:13px;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);font-weight:600;
display:flex;align-items:center;gap:9px}
.card h2 .n{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--text-muted)}
.callno{width:19px;height:19px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;
display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.bd{padding:6px 15px 8px}
.r{display:grid;grid-template-columns:24px 1fr 62px;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:start}
.r:last-of-type{border-bottom:none}
.r .no{font-size:11px;color:var(--text-muted);text-align:right;padding-top:5px}
.tx{font-size:12.7px;line-height:1.72;border:1px solid transparent;border-radius:6px;padding:3px 7px;
margin-left:-7px;outline:none;cursor:text}
.tx:hover{border-color:var(--border);background:var(--surface)}
.tx:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px var(--primary-light)}
.r.ro .tx{color:var(--text-muted);background:var(--surface);border-color:var(--border);cursor:default}
.cat{font-size:10.5px;color:var(--text-muted)}
.acts{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:.12s;padding-top:4px}
.r:hover .acts{opacity:1}
.acts button{border:none;background:none;cursor:pointer;font-size:11px;color:var(--text-muted);
padding:2px 4px;border-radius:4px;font-family:inherit}
.acts button:hover{background:var(--surface);color:var(--error)}
.acts button.undo:hover{color:var(--primary)}
.b{display:inline-block;font-size:10px;padding:0 6px;border-radius:999px;border:1px solid;line-height:1.7;
white-space:nowrap;margin-left:6px;vertical-align:1px}
.b.new{color:var(--success);background:var(--success-bg);border-color:var(--success-border)}
.b.changed{color:var(--warning);background:var(--warning-bg);border-color:var(--warning-border)}
.b.dirty{color:var(--primary);background:var(--primary-light);border-color:rgba(30,64,175,.25)}
.b.ro{color:var(--text-muted);background:var(--surface);border-color:var(--border)}
.note{font-size:11px;color:var(--warning);margin-top:3px;line-height:1.55}
.addrow{padding:0 15px 12px}
.addrow button{border:1px dashed var(--border);background:none;color:var(--text-secondary);border-radius:7px;
padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.addrow button:hover{border-color:var(--primary);color:var(--primary)}
.foot{font-size:11.5px;color:var(--text-muted);padding:10px 15px;border-top:1px solid var(--line);background:var(--surface)}
.savebar{position:sticky;bottom:12px;background:var(--panel);border:1px solid var(--border);border-top-width:2px;
border-radius:var(--radius);padding:11px 15px;display:flex;align-items:center;gap:10px;
box-shadow:0 4px 18px rgba(15,23,42,.07);margin-top:14px}
.btn{border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:7px;padding:6px 14px;
font-size:12.5px;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:var(--text-secondary);border-color:var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed}

cal advisor | responsibilities | duties | what would I do | my responsibilities | technical advisor | role.responsibilities | Responsibilities depend on the project and may include technical guidance, research advice, problem-solving, product-development support or commercialisation guidance.\"\n  },\n  {\n    \"fact_id\": \"KB-WORK-031\",\n    \"title\": \"现有单位、搬迁及赴华安排\",\n    \"category\": \"Role and work style\",\n    \"coverage_keys\": [\n      \"work.affiliation\",\n      \"work.relocation\",\n      \"work.travel_arrangement\"\n    ],\n    \"reply_policy\": \"AUTO\",\n    \"status\": \"APPROVED\",\n    \"risk_level\": \"MEDIUM\",\n    \"render_mode\": \"COMPOSE\",\n    \"retrieval_text\": \"现有单位、搬迁及赴华安排 | current affiliation | university affiliation | remain employed | relocate | move to China | visits | travel expenses | work location | current affiliation | university affiliation | remain employed | relocate | move to China | visits | travel expenses | work location | work.affiliation | work.relocation | work.travel_arrangement | A typical remote advisory arrangement does not require relocation or a change to the expert's current institutional affiliation. Short visits to China may be arranged where the project requires them, with travel support determined by the project arrangement.\"\n  },\n  {\n    \"fact_id\": \"KB-WORK-032\",\n    \"title\": \"合作期限及投入时间\",\n    \"category\": \"Role and work style\",\n    \"coverage_keys\": [\n      \"work.advisory_duration\",\n      \"work.time_commitment\"\n    ],\n    \"reply_policy\": \"REVIEW\",\n    \"status\": \"REVIEW\",\n    \"risk_level\": \"MEDIUM\",\n    \"render_mode\": \"COMPOSE\",\n    \"retrieval_text\": \"合作期限及投入时间 | project duration | time commitment | weekly hours | monthly hours | how involved | duration for technical advisers | project duration | time commitment | weekly hours | monthly hours | how involved | duration for technical advisers | work.advisory_duration | work.time_commitment | A research
