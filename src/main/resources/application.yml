spring:
  application:
    name: weibo-talent-introduction
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/talent_introduction?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移中的 ${...} 是邮件模板变量（数据），不是 Flyway 占位符。
    # 开启替换会导致含 ${} 的正文迁移抛 "No value provided for placeholder expressions"。
    placeholder-replacement: false
  servlet:
    multipart:
      # 共享 multipart parser ceiling（I-4）：这是**容器前置保护**，不是业务上限。
      # 手动材料（V130）业务上限精确为 100 * 1024 * 1024 = 104857600 字节，由
      # ManualExpertMaterialUploadService 按实际读入字节计数裁决；Spring DataSize 的
      # MB = 1024^2，故 max-file-size 100MB 恰好等于该业务上限，max-request-size 101MB
      # 只留 multipart 边界/头部空间。解析期超限由容器抛 MaxUploadSizeExceededException，
      # 经 GlobalExceptionHandler 固定 413（code=PAYLOAD_TOO_LARGE）。
      # 旧「人工回复通用附件」服务仍以自己的 MAX_FILE_BYTES = 10 MiB 常量二次拒绝
      # （OutboundAttachmentServiceTest 守住），提高本上限不会放宽其业务限制。
      max-file-size: 100MB
      max-request-size: 101MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2

talent-introduction:
  auth:
    enabled: ${AUTH_ENABLED:true}
  expert-classification:
    incremental-enabled: ${EXPERT_CLASSIFICATION_INCREMENTAL_ENABLED:false}
    promotion-gate-enabled: ${EXPERT_CLASSIFICATION_PROMOTION_GATE_ENABLED:false}
    incremental-cron: ${EXPERT_CLASSIFICATION_INCREMENTAL_CRON:0 0 4 * * ?}
    batch-size: ${EXPERT_CLASSIFICATION_BATCH_SIZE:500}
    delay-ms: ${EXPERT_CLASSIFICATION_DELAY_MS:250}
    max-docs-per-run: ${EXPERT_CLASSIFICATION_MAX_DOCS_PER_RUN:50000}
  elasticsearch:
    base-url: ${ES_BASE_URL:https://es-fcxvip4d.public.tencentelasticsearch.com:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:}
    raw-index-name: ${ES_RAW_INDEX_NAME:orcid_info}
    candidate-index-name: ${ES_CANDIDATE_INDEX_NAME:orcid_info_candidate}
    application-index-name: ${ES_APPLICATION_INDEX_NAME:orcid_info_application}
    unsupported-answer-index-name: ${ES_UNSUPPORTED_ANSWER_INDEX_NAME:trust_reply_unsupported_answer_v1}
  candidate-filter:
    require-orcid: ${CANDIDATE_REQUIRE_ORCID:false}
    require-doctoral-degree: ${CANDIDATE_REQUIRE_DOCTORAL_DEGREE:false}
    require-valid-email: ${CANDIDATE_REQUIRE_VALID_EMAIL:true}
    exclude-chinese-nationality: ${CANDIDATE_EXCLUDE_CHINESE_NATIONALITY:true}
    enable-age-filter: ${CANDIDATE_ENABLE_AGE_FILTER:false}
    max-age-exclusive: ${CANDIDATE_MAX_AGE_EXCLUSIVE:70}
  mail-queue:
    enabled: ${MAIL_QUEUE_ENABLED:false}
    exchange: ${MAIL_QUEUE_EXCHANGE:talent.mail.exchange}
    dead-letter-exchange: ${MAIL_QUEUE_DEAD_LETTER_EXCHANGE:talent.mail.dlx}
    initial-outreach-queue: ${MAIL_QUEUE_INITIAL_OUTREACH_QUEUE:talent.mail.initial-outreach}
    auto-reply-account-queue: ${MAIL_QUEUE_AUTO_REPLY_ACCOUNT_QUEUE:talent.mail.auto-reply.account}
    auto-reply-all-accounts-queue: ${MAIL_QUEUE_AUTO_REPLY_ALL_ACCOUNTS_QUEUE:talent.mail.auto-reply.all}
    initial-outreach-dead-letter-queue: ${MAIL_QUEUE_INITIAL_OUTREACH_DLQ:talent.mail.initial-outreach.dlq}
    auto-reply-account-dead-letter-queue: ${MAIL_QUEUE_AUTO_REPLY_ACCOUNT_DLQ:talent.mail.auto-reply.account.dlq}
    auto-reply-all-accounts-dead-letter-queue: ${MAIL_QUEUE_AUTO_REPLY_ALL_ACCOUNTS_DLQ:talent.mail.auto-reply.all.dlq}
    initial-outreach-routing-key: ${MAIL_QUEUE_INITIAL_OUTREACH_ROUTING_KEY:mail.initial-outreach}
    auto-reply-account-routing-key: ${MAIL_QUEUE_AUTO_REPLY_ACCOUNT_ROUTING_KEY:mail.auto-reply.account}
    auto-reply-all-accounts-routing-key: ${MAIL_QUEUE_AUTO_REPLY_ALL_ACCOUNTS_ROUTING_KEY:mail.auto-reply.all}
    initial-outreach-dead-letter-routing-key: ${MAIL_QUEUE_INITIAL_OUTREACH_DLX_ROUTING_KEY:mail.initial-outreach.dlq}
    auto-reply-account-dead-letter-routing-key: ${MAIL_QUEUE_AUTO_REPLY_ACCOUNT_DLX_ROUTING_KEY:mail.auto-reply.account.dlq}
    auto-reply-all-accounts-dead-letter-routing-key: ${MAIL_QUEUE_AUTO_REPLY_ALL_ACCOUNTS_DLX_ROUTING_KEY:mail.auto-reply.all.dlq}
    auto-reply-account-concurrency: ${MAIL_QUEUE_AUTO_REPLY_ACCOUNT_CONCURRENCY:2-8}
  scheduling:
    enabled: ${MAIL_SCHEDULING_ENABLED:false}
    auto-reply-all-cron: ${MAIL_SCHEDULING_AUTO_REPLY_ALL_CRON:-}
    auto-reply-max-messages-per-account: ${MAIL_SCHEDULING_AUTO_REPLY_MAX_MESSAGES_PER_ACCOUNT:20}
    initial-outreach-cron: ${MAIL_SCHEDULING_INITIAL_OUTREACH_CRON:-}
    initial-outreach-campaign-id: ${MAIL_SCHEDULING_INITIAL_OUTREACH_CAMPAIGN_ID:0}
    initial-outreach-batch-size: ${MAIL_SCHEDULING_INITIAL_OUTREACH_BATCH_SIZE:10}
    initial-outreach-send-interval-ms: ${MAIL_SCHEDULING_INITIAL_OUTREACH_SEND_INTERVAL_MS:30000}
    initial-outreach-send-jitter-ms: ${MAIL_SCHEDULING_INITIAL_OUTREACH_SEND_JITTER_MS:60000}
    initial-outreach-expert-types: ${MAIL_SCHEDULING_INITIAL_OUTREACH_EXPERT_TYPES:}
    operator-status-sync-cron: ${MAIL_SCHEDULING_OPERATOR_STATUS_SYNC_CRON:-}
    ai-qa-extraction-cron: ${MAIL_SCHEDULING_AI_QA_EXTRACTION_CRON:-}
    ai-qa-extraction-max-contacts: ${MAIL_SCHEDULING_AI_QA_EXTRACTION_MAX_CONTACTS:20}
  task-retention:
    enabled: ${TASK_RETENTION_ENABLED:false}
    cron: ${TASK_RETENTION_CRON:0 30 4 * * *}
    retention-days: ${TASK_RETENTION_DAYS:90}
    batch-size: ${TASK_RETENTION_BATCH_SIZE:2000}
    max-rows-per-run: ${TASK_RETENTION_MAX_ROWS_PER_RUN:200000}
  postmaster:
    enabled: ${POSTMASTER_ENABLED:false}
    oauth-client-id: ${POSTMASTER_OAUTH_CLIENT_ID:}
    oauth-client-secret: ${POSTMASTER_OAUTH_CLIENT_SECRET:}
    oauth-redirect-uri: ${POSTMASTER_OAUTH_REDIRECT_URI:}
    oauth-token-file: ${POSTMASTER_OAUTH_TOKEN_FILE:/etc/talent/secrets/postmaster-oauth-token.json}
    domains: ${POSTMASTER_DOMAINS:}
    cron: ${POSTMASTER_CRON:0 0 8 * * *}
    pause-threshold-spam-rate: ${POSTMASTER_PAUSE_THRESHOLD_SPAM_RATE:0.003}
    resume-threshold-spam-rate: ${POSTMASTER_RESUME_THRESHOLD_SPAM_RATE:0.001}
    resume-consecutive-days: ${POSTMASTER_RESUME_CONSECUTIVE_DAYS:3}
  manual-outreach:
    send-interval-ms: ${MANUAL_OUTREACH_SEND_INTERVAL_MS:1000}
  unsubscribe:
    base-url: ${UNSUBSCRIBE_BASE_URL:}
    secret: ${UNSUBSCRIBE_SECRET:}
    brand-name: ${UNSUBSCRIBE_BRAND_NAME:Qingfei Talent}
    brand-logo-url: ${UNSUBSCRIBE_BRAND_LOGO_URL:}
    site-url: ${UNSUBSCRIBE_SITE_URL:https://www.qingfeitalent.com}
    footer-line1: ${UNSUBSCRIBE_FOOTER_LINE1:Jiangsu Qingfei Talent Technology Co., Ltd · Nanjing}
    footer-line2: ${UNSUBSCRIBE_FOOTER_LINE2:QFtechtalent@qftechtalent.com}
  warmup:
    enabled: ${WARMUP_ENABLED:false}
  backfill:
    contact-country:
      enabled: ${BACKFILL_CONTACT_COUNTRY_ENABLED:false}
  llm:
    enabled: ${LLM_ENABLED:false}
    auto-reply-enabled: ${LLM_AUTO_REPLY_ENABLED:false}
    shadow-scoring-enabled: ${LLM_SHADOW_SCORING_ENABLED:false}
    api-url: ${LLM_API_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    reply-flash-model: ${LLM_REPLY_MODEL_FLASH:deepseek-v4-flash}
    reply-pro-model: ${LLM_REPLY_MODEL_PRO:deepseek-v4-pro}
    timeout-ms: ${LLM_TIMEOUT_MS:30000}
    fact-retriever:
      enabled: ${LLM_FACT_RETRIEVER_ENABLED:false}
      enabled-for-auto-reply: ${LLM_FACT_RETRIEVER_AUTO_REPLY_ENABLED:false}
      max-facts-per-request: ${LLM_FACT_RETRIEVER_MAX_FACTS:3}
  rag:
    prefilter-limit: ${RAG_PREFILTER_LIMIT:18}
    retrieval-limit: ${RAG_RETRIEVAL_LIMIT:14}
    min-lexical-score: ${RAG_MIN_LEXICAL_SCORE:2}
    coverage-weight: ${RAG_COVERAGE_WEIGHT:100.0}
    phrase-weight: ${RAG_PHRASE_WEIGHT:12.0}
    overlap-weight: ${RAG_OVERLAP_WEIGHT:1.0}
    retrieval-temperature: ${RAG_RETRIEVAL_TEMPERATURE:0.0}
    generation-temperature: ${RAG_GENERATION_TEMPERATURE:0.2}
    retrieval-max-tokens: ${RAG_RETRIEVAL_MAX_TOKENS:900}
    generation-max-tokens: ${RAG_GENERATION_MAX_TOKENS:2600}
  translation:
    enabled: ${TRANSLATION_ENABLED:false}
    base-url: ${TRANSLATION_BASE_URL:http://127.0.0.1:5000}
    source: ${TRANSLATION_SOURCE:en}
    target: ${TRANSLATION_TARGET:zh-Hans}
    timeout-ms: ${TRANSLATION_TIMEOUT_MS:5000}
    max-chars: ${TRANSLATION_MAX_CHARS:5000}
    api-key: ${TRANSLATION_API_KEY:}
  academic-filter:
    enable-h-index-filter: ${ACADEMIC_ENABLE_H_INDEX_FILTER:false}
    min-h-index: ${ACADEMIC_MIN_H_INDEX:5}
    enable-citation-filter: ${ACADEMIC_ENABLE_CITATION_FILTER:false}
    min-citation-count: ${ACADEMIC_MIN_CITATION_COUNT:50}
    enable-activity-filter: ${ACADEMIC_ENABLE_ACTIVITY_FILTER:false}
    recent-years-threshold: ${ACADEMIC_RECENT_YEARS_THRESHOLD:5}
  email-validation:
    enable-mx-check: ${EMAIL_ENABLE_MX_CHECK:true}
    enable-smtp-verify: ${EMAIL_ENABLE_SMTP_VERIFY:false}
    cache-ttl-days: ${EMAIL_CACHE_TTL_DAYS:30}
    disposable-domain-list-path: ${EMAIL_DISPOSABLE_LIST:classpath:email/disposable-domains.txt}
    mx-lookup-timeout-ms: ${EMAIL_MX_LOOKUP_TIMEOUT_MS:5000}
  mail-attachment-storage:
    base-path: ${MAIL_ATTACHMENT_STORAGE_BASE_PATH:/opt/talent/uploads/mail-attachments}
  expert-discovery:
    enabled: ${EXPERT_DISCOVERY_ENABLED:true}
    cron: ${EXPERT_DISCOVERY_CRON:0 0 2 * * ?}
    # c9（I-1）: 运行级上限与单批/单页解耦 —— 全部论文源合计 15000、作者 20000。
    # 论文页 100 与补全批量 100 只是每批大小，不是每日总量；启动校验会要求全局上限
    # 至少覆盖各启用来源的一页，否则拒绝启动（0 不是无限量）。
    max-papers-per-run: ${EXPERT_DISCOVERY_MAX_PAPERS:15000}
    max-authors-per-run: ${EXPERT_DISCOVERY_MAX_AUTHORS:20000}
    include-raw-scan: ${EXPERT_DISCOVERY_INCLUDE_RAW_SCAN:false}
    fetch-concurrency: ${EXPERT_DISCOVERY_FETCH_CONCURRENCY:4}
    # c9（I-3）: 单次发现的时间预算；到点按 TIME_BUDGET 停止并保留进入当前页的检查点。
    time-budget: ${EXPERT_DISCOVERY_TIME_BUDGET:4h}
    # I-2: 发现后自动补全默认关闭，验收后在服务器开启；批次上限 100（只是一批，不是每日总量）。
    auto-enrichment-enabled: ${EXPERT_DISCOVERY_AUTO_ENRICHMENT_ENABLED:false}
    auto-enrichment-batch-size: ${EXPERT_DISCOVERY_AUTO_ENRICHMENT_BATCH_SIZE:100}
    # c2（I-5/I-6/I-7）: 持久化采集队列（取数与处理解耦）。pipeline-enabled 默认 false ——
    # 生产入口（controller/scheduler）在下一阶段才切换，本阶段只由受控服务调用 launch/tick 验收。
    # - queue-high/low-water：活跃 job 高/低水位；触达高水位整页不入队、游标不推进，
    #   必须回落到低水位且字节足够容纳一页才恢复（启动校验 0 < low < high）。
    # - queue-max-bytes：实际负载 + 在途结果预留的总上限（默认 1 GiB）；启动校验必须至少容一页。
    # - metadata/extraction-max-bytes：单条元数据/抽取结果上限；超限形成轻量 FAILED 诊断。
    # - per-host-concurrency：同一目标域（含重定向落点）的最大在飞 HTTP 请求数。
    # - pipeline-tick：tick 最小间隔；窗口长度沿用上面的 time-budget（4h）。
    # - pipeline-fetch-concurrency：新队列提取线程数（= 全局最多同时 8 个提取任务）；
    #   旧 fetch-concurrency / discoveryFetchExecutor 语义逐字不变。
    pipeline-enabled: ${EXPERT_DISCOVERY_PIPELINE_ENABLED:false}
    queue-high-water: ${EXPERT_DISCOVERY_QUEUE_HIGH_WATER:20000}
    queue-low-water: ${EXPERT_DISCOVERY_QUEUE_LOW_WATER:10000}
    queue-max-bytes: ${EXPERT_DISCOVERY_QUEUE_MAX_BYTES:1073741824}
    metadata-max-bytes: ${EXPERT_DISCOVERY_METADATA_MAX_BYTES:65536}
    extraction-max-bytes: ${EXPERT_DISCOVERY_EXTRACTION_MAX_BYTES:32768}
    per-host-concurrency: ${EXPERT_DISCOVERY_PER_HOST_CONCURRENCY:2}
    pipeline-tick: ${EXPERT_DISCOVERY_PIPELINE_TICK:30s}
    pipeline-fetch-concurrency: ${EXPERT_DISCOVERY_PIPELINE_FETCH_CONCURRENCY:8}
    europe-pmc:
      enabled: ${EUROPE_PMC_ENABLED:true}
      base-url: ${EUROPE_PMC_BASE_URL:https://www.ebi.ac.uk/europepmc/webservices/rest}
      request-delay-ms: ${EUROPE_PMC_REQUEST_DELAY_MS:1000}
      connect-timeout-ms: ${EUROPE_PMC_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${EUROPE_PMC_READ_TIMEOUT_MS:30000}
      max-papers-per-source: ${EUROPE_PMC_MAX_PAPERS:1500}
      max-retries: ${EUROPE_PMC_MAX_RETRIES:2}
      retry-backoff-ms: ${EUROPE_PMC_RETRY_BACKOFF_MS:500}
    openalex:
      enabled: ${OPENALEX_ENABLED:true}
      polite-email: ${OPENALEX_POLITE_EMAIL:wuwei@qftechtalent.com}
      base-url: ${OPENALEX_BASE_URL:https://api.openalex.org}
      request-delay-ms: ${OPENALEX_REQUEST_DELAY_MS:100}
      # c9（I-1）: 上线目标 10000（主方案建议值）；与 OpenAlexProperties 的默认值保持同值。
      max-papers-per-source: ${OPENALEX_MAX_PAPERS:10000}
      connect-timeout-ms: ${OPENALEX_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${OPENALEX_READ_TIMEOUT_MS:15000}
      enrichment-delay-ms: ${OPENALEX_ENRICHMENT_DELAY_MS:300}
      enrichment-batch-size: ${OPENALEX_ENRICHMENT_BATCH_SIZE:50}
      enrichment-rate-limit-mode: ${OPENALEX_ENRICHMENT_RATE_LIMIT_MODE:WAIT}
      enrichment-max-backoff-ms: ${OPENALEX_ENRICHMENT_MAX_BACKOFF_MS:1800000}
      fetch-works-enabled: ${OPENALEX_FETCH_WORKS_ENABLED:false}
      fetch-patents-enabled: ${OPENALEX_FETCH_PATENTS_ENABLED:false}
      api-key: ${OPENALEX_API_KEY:}
      max-requests-per-second: ${OPENALEX_MAX_REQUESTS_PER_SECOND:5.0}
      new-enrichment-reserve-ratio: ${OPENALEX_NEW_ENRICHMENT_RESERVE_RATIO:0.2}
      daily-budget-usd: ${OPENALEX_DAILY_BUDGET_USD:0}
      rate-limit-backoff-max-ms: ${OPENALEX_RATE_LIMIT_BACKOFF_MAX_MS:60000}
      # 账号预算（子计划 01 I-2/I-4）：
      # - account-scope 是**非秘密**的稳定账号标识：同一 API Key 的全部实例共用它，预算才真正共享；
      #   换 Key 不换 scope（已用额度不重置），换成另一个真实账号才换 scope。绝不能由 Key 明文派生。
      # - free-budget-credits 是免费消费保护上限：有效免费上限 = min(官方日免费额度, 本值, 旧 daily-budget-usd 折算)，
      #   预付余额永不加入；daily-budget-usd=0 只表示「采用免费保护默认值」，绝不表示无限。
      account-scope: ${OPENALEX_ACCOUNT_SCOPE:primary}
      free-budget-credits: ${OPENALEX_FREE_BUDGET_CREDITS:10000}
      # - budget-sync-interval：官方 /rate-limit 校准周期（启动/日切/额度不足/异常恢复之外每满该间隔再校准一次）。
      budget-sync-interval: ${OPENALEX_BUDGET_SYNC_INTERVAL:300s}
    crossref:
      enabled: ${CROSSREF_ENABLED:true}
      base-url: ${CROSSREF_BASE_URL:https://api.crossref.org}
      polite-email: ${CROSSREF_POLITE_EMAIL:wuwei@qftechtalent.com}
      request-delay-ms: ${CROSSREF_REQUEST_DELAY_MS:200}
      # c9（I-1）: 单源上限 1000（CrossrefProperties 的 Kotlin 默认值更保守，生产以本行为准）。
      max-papers-per-source: ${CROSSREF_MAX_PAPERS:1000}
    unpaywall:
      base-url: ${UNPAYWALL_BASE_URL:https://api.unpaywall.org/v2}
      email: ${UNPAYWALL_EMAIL:wuwei@qftechtalent.com}
      request-delay-ms: ${UNPAYWALL_REQUEST_DELAY_MS:200}
    arxiv:
      enabled: ${ARXIV_ENABLED:true}
      # I-2: 官方 http 入口实测返回 301 空体；此默认值覆盖 ArxivProperties 的默认值，两处必须同为 https。
      base-url: ${ARXIV_BASE_URL:https://export.arxiv.org/api}
      request-delay-ms: ${ARXIV_REQUEST_DELAY_MS:3000}
      # c9（I-1）: 单源上限 2000（ArxivProperties 的 Kotlin 默认值更保守，生产以本行为准）。
      max-papers-per-source: ${ARXIV_MAX_PAPERS:2000}
    pdf-extraction:
      max-pdf-size-bytes: ${PDF_MAX_SIZE:10485760}
      download-timeout-ms: ${PDF_DOWNLOAD_TIMEOUT_MS:60000}
      max-pages: 2
      max-retries: ${PDF_MAX_RETRIES:2}
      retry-backoff-ms: ${PDF_RETRY_BACKOFF_MS:500}
      html-fallback-enabled: ${PDF_HTML_FALLBACK_ENABLED:true}
    pmc-oa:
      enabled: ${PMC_OA_ENABLED:true}
      base-url: ${PMC_OA_BASE_URL:https://eutils.ncbi.nlm.nih.gov/entrez/eutils}
      api-key: ${PMC_OA_API_KEY:6c4864e04379d75cbc61f34e70e2ed915308}
      request-delay-ms: ${PMC_OA_REQUEST_DELAY_MS:350}
      max-papers-per-source: ${PMC_OA_MAX_PAPERS:1000}
    orcid:
      enabled: ${ORCID_ENABLED:true}
      base-url: ${ORCID_BASE_URL:https://pub.orcid.org/v3.0}
      request-delay-ms: ${ORCID_REQUEST_DELAY_MS:100}
      max-records-per-run: ${ORCID_MAX_RECORDS:1000}
    core:
      enabled: ${CORE_ENABLED:true}
      base-url: ${CORE_BASE_URL:https://api.core.ac.uk/v3}
      api-key: ${CORE_API_KEY:ZoMR12vcSKhDsnfuHbCjEUpr3gw74BQO}
      request-delay-ms: ${CORE_REQUEST_DELAY_MS:600}
      # c9（I-1）: 单源上限 1000（CoreProperties 的 Kotlin 默认值更保守，生产以本行为准）。
      max-papers-per-source: ${CORE_MAX_PAPERS:1000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
