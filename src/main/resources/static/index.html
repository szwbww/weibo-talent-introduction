<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Talent Introduction Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260604-qa-modal">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div>
                <div class="brand-title">Talent Console</div>
                <div class="brand-subtitle">专家引进自动化</div>
            </div>
        </div>
        <nav class="nav-tabs" aria-label="Main">
            <button class="nav-tab" data-view="monitoring">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 6-6"/></svg>
                <span>邮件监控</span>
            </button>
            <button class="nav-tab active" data-view="accounts">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                <span>邮箱账号</span>
            </button>
            <button class="nav-tab" data-view="qa">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>QA 规则</span>
            </button>
            <button class="nav-tab" data-view="contacts">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>专家联系</span>
            </button>
            <button class="nav-tab" data-view="unmatched">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01"/><path d="M12 10h.01"/><path d="M16 10h.01"/></svg>
                <span>待处理邮件</span>
                <span id="unmatchedBadgeHigh" class="nav-badge nav-badge-high" hidden>0</span>
                <span id="unmatchedBadgeNormal" class="nav-badge nav-badge-normal" hidden>0</span>
            </button>
            <button class="nav-tab" data-view="tasks">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>任务记录</span>
            </button>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <h1 id="viewTitle">邮箱账号</h1>
                <p id="viewSubtitle">维护发送账号、权重、限额和连通性。</p>
            </div>
            <div class="topbar-actions">
                <button class="button secondary" id="refreshBtn">刷新</button>
            </div>
        </header>

        <section id="statusBar" class="status-bar" hidden></section>

        <section class="view" id="view-monitoring">
            <div class="toolbar">
                <input type="date" id="monitoringDate">
                <select id="monitoringSenderAccount"><option value="">全部账号</option></select>
                <button class="button secondary" id="monitoringRefreshBtn">手动刷新</button>
                <span class="muted" id="monitoringLastRefreshed"></span>
            </div>
            <section class="panel">
                <div class="panel-head"><h2>今日概览</h2></div>
                <div id="monitoringCards" class="card-grid"></div>
            </section>
            <section class="panel">
                <div class="panel-head">
                    <div class="tabs" id="monitoringSubTabs">
                        <button class="tab active" data-subtab="introductions">介绍邮件</button>
                        <button class="tab" data-subtab="inbound">收到回复</button>
                        <button class="tab" data-subtab="outbound">已发回复</button>
                        <button class="tab" data-subtab="pending">待处理邮件</button>
                        <button class="tab" data-subtab="promotions">晋级记录</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table id="monitoringActivityTable"><thead></thead><tbody></tbody></table>
                </div>
                <div class="pagination" id="monitoringPagination"></div>
            </section>
            <section class="panel">
                <div class="panel-head"><h2>发件账号健康</h2></div>
                <div class="table-wrap">
                    <table id="monitoringSenderHealthTable"><thead></thead><tbody></tbody></table>
                </div>
            </section>
        </section>

        <section class="view active" id="view-accounts">
            <div class="toolbar">
                <button class="button primary" id="newAccountBtn">新增账号</button>
                <button class="button" id="reloadAccountsBtn">重新加载</button>
            </div>
            <section class="panel">
                <div class="panel-head">
                    <h2>账号池</h2>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>账号</th>
                            <th>邮箱</th>
                            <th>权重</th>
                            <th>今日/上限</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="accountsTable"></tbody>
                    </table>
                </div>
            </section>
        </section>

        <section class="view" id="view-qa">
            <div class="toolbar">
                <button class="button primary" id="newQaRuleBtn">新增规则</button>
                <select id="qaCategoryFilter">
                    <option value="">全部分类</option>
                </select>
                <button class="button" id="reloadQaBtn">刷新</button>
            </div>
            <div class="split-layout qa-layout">
                <section class="panel">
                    <div class="panel-head">
                        <h2>QA 分类</h2>
                    </div>
                    <div id="categoryList" class="list"></div>
                    <form id="categoryForm" class="inline-form">
                        <input name="categoryCode" placeholder="分类编码" required>
                        <input name="categoryName" placeholder="分类名称" required>
                        <button class="button primary" type="submit">新增</button>
                    </form>
                </section>
                <section class="panel">
                    <div class="panel-head">
                        <h2>规则列表</h2>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>中文名</th>
                                <th>分类</th>
                                <th>英文主题</th>
                                <th>关键词</th>
                                <th>优先级</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody id="qaRulesTable"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </section>

        <section class="view" id="view-contacts">
            <div class="toolbar">
                <select id="expertIndexLevel">
                    <option value="RAW">原始</option>
                    <option value="CANDIDATE" selected>筛选</option>
                    <option value="APPLICATION">有效</option>
                </select>
                <select id="expertIndexSize">
                    <option value="10">每页 10 条</option>
                    <option value="20">每页 20 条</option>
                    <option value="50" selected>每页 50 条</option>
                    <option value="100">每页 100 条</option>
                </select>
                <select id="contactNeedsAttentionFilter">
                    <option value="">全部人工待办</option>
                    <option value="true">仅看需要人工处理</option>
                    <option value="false">仅看正常处理中</option>
                </select>
                <select id="contactStatusFilter">
                    <option value="">全部状态</option>
                </select>
                <button class="button" id="loadContactsBtn">加载专家</button>
            </div>
            <div class="split-layout contacts-layout">
                <section class="panel">
                    <div class="panel-head"><h2>专家列表</h2></div>
                    <div id="contactList" class="list"></div>
                </section>
                <section class="panel contact-detail-panel">
                    <div class="panel-head contact-detail-head">
                        <h2>详情与处理</h2>
                        <div class="contact-head-actions" id="contactHeadActions" hidden></div>
                    </div>
                    <div id="contactDetail" class="detail-empty">选择一位专家。</div>
                </section>
            </div>
        </section>

        <section class="view" id="view-unmatched">
            <div class="toolbar">
                <button class="button primary" id="loadUnmatchedBtn">刷新</button>
                <select id="unmatchedFilterReasonType">
                    <option value="">全部原因</option>
                    <option value="UNMATCHED_CONTACT">未匹配到专家</option>
                    <option value="QA_NO_MATCH">QA 未命中</option>
                    <option value="NOT_INTERESTED">专家不感兴趣</option>
                    <option value="UNCLEAR_INTENT">意图模糊</option>
                </select>
                <input id="unmatchedFilterEmail" placeholder="发件邮箱筛选" style="width: auto; min-width: 200px;">
                <input id="unmatchedFilterSubject" placeholder="主题筛选" style="width: auto; min-width: 200px;">
                <select id="unmatchedPageSize">
                    <option value="10">每页 10 条</option>
                    <option value="20" selected>每页 20 条</option>
                    <option value="50">每页 50 条</option>
                    <option value="100">每页 100 条</option>
                </select>
            </div>
            <section class="panel">
                <div class="panel-head"><h2>人工处理队列</h2></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>发件邮箱</th>
                            <th>主题</th>
                            <th>收信时间</th>
                            <th>关联专家</th>
                            <th>处理原因</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="unmatchedTable"></tbody>
                    </table>
                </div>
            </section>
            <section class="panel" id="unmatchedDetailPanel" hidden>
                <div class="panel-head">
                    <h2>来信详情与绑定</h2>
                    <button class="button secondary" id="closeUnmatchedDetailBtn">关闭</button>
                </div>
                <div id="unmatchedDetailContent" class="detail"></div>
            </section>
        </section>

        <section class="view" id="view-tasks">
            <div class="toolbar">
                <select id="taskTypeFilter">
                    <option value="">全部任务</option>
                    <option value="INITIAL_OUTREACH">首发邮件</option>
                    <option value="AUTO_REPLY_ALL">自动回复全量轮询</option>
                    <option value="AUTO_REPLY_ACCOUNT">自动回复账号轮询</option>
                    <option value="AUTO_REPLY_ALL_DISPATCH">自动回复批量分发</option>
                </select>
                <select id="taskStatusFilter">
                    <option value="">全部状态</option>
                    <option value="RUNNING">运行中</option>
                    <option value="SUCCESS">成功</option>
                    <option value="FAILED">失败</option>
                </select>
                <button class="button" id="loadTasksBtn">查询</button>
            </div>
            <section class="panel">
                <div class="panel-head"><h2>任务执行记录</h2></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>任务</th>
                            <th>触发</th>
                            <th>状态</th>
                            <th>成功/失败</th>
                            <th>开始时间</th>
                            <th>错误</th>
                        </tr>
                        </thead>
                        <tbody id="tasksTable"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</div>
<div class="modal-shell" id="accountModal" hidden>
    <button class="modal-backdrop" id="accountModalBackdrop" type="button" aria-label="关闭账号配置"></button>
    <section class="panel editor-panel modal-panel" id="accountEditorPanel" role="dialog" aria-modal="true" aria-labelledby="accountEditorTitle">
        <div class="panel-head modal-head">
            <h2 id="accountEditorTitle">账号配置</h2>
            <button class="icon-button" id="accountModalCloseBtn" type="button" aria-label="关闭账号配置">×</button>
        </div>
        <form id="accountForm" class="form-grid account-form">
            <label>账号编码<input name="accountCode" required></label>
            <label>发送邮箱<input name="senderEmail" required></label>
            <label>发送人姓名<input name="senderName" required></label>
            <label>职位<input name="senderTitle"></label>
            <label>显示名称<input name="senderDisplayName"></label>
            <label>团队名称<input name="teamName"></label>
            <label>国家<input name="countryName"></label>
            <label>SMTP Host<input name="smtpHost" required></label>
            <label>SMTP Port<input name="smtpPort" type="number" value="465" required></label>
            <label>SMTP 用户名<input name="smtpUsername" required></label>
            <label>SMTP 授权码<input name="smtpPassword" type="password" required></label>
            <label>IMAP Host<input name="imapHost" required></label>
            <label>IMAP Port<input name="imapPort" type="number" value="993" required></label>
            <label>IMAP 用户名<input name="imapUsername" required></label>
            <label>IMAP 授权码<input name="imapPassword" type="password" required></label>
            <label>权重<input name="strategyWeight" type="number" value="100" required></label>
            <label>每日上限<input name="dailySendLimit" type="number" value="100" required></label>
            <label>今日已发<input name="todaySentCount" type="number" value="0"></label>
            <label class="checkbox-row"><input name="enabled" type="checkbox" checked> 启用</label>
            <div class="form-actions modal-actions">
                <button class="button primary" type="submit" id="saveAccountBtn">保存</button>
                <button class="button secondary" type="button" id="clearAccountFormBtn">取消</button>
            </div>
        </form>
    </section>
</div>
<div class="modal-shell" id="qaRuleModal" hidden>
    <button class="modal-backdrop" id="qaRuleModalBackdrop" type="button" aria-label="关闭规则编辑"></button>
    <section class="panel editor-panel modal-panel" role="dialog" aria-modal="true" aria-labelledby="qaRuleEditorTitle">
        <div class="panel-head modal-head">
            <h2 id="qaRuleEditorTitle">QA 规则</h2>
            <button class="icon-button" id="qaRuleModalCloseBtn" type="button" aria-label="关闭规则编辑">×</button>
        </div>
        <form id="qaRuleForm" class="form-grid account-form">
            <label class="span-2">中文显示名<input name="displayName" placeholder="例如：项目内容介绍" required></label>
            <label>规则 ID<input name="id" disabled></label>
            <label>分类
                <select name="categoryId" required>
                    <option value="">请选择分类</option>
                </select>
            </label>
            <label>关键词<input name="keywords" placeholder="逗号分隔" required></label>
            <label>匹配模式
                <select name="matchMode">
                    <option value="ANY">ANY</option>
                    <option value="ALL">ALL</option>
                </select>
            </label>
            <label>优先级<input name="priority" type="number" value="100" required></label>
            <label>英文回复主题<input name="replySubject" placeholder="About the talent program"></label>
            <label class="span-2">英文回复正文<textarea name="replyBody" rows="8" required></textarea></label>
            <label class="checkbox-row"><input name="autoReplyEnabled" type="checkbox" checked> 自动回复</label>
            <label class="checkbox-row"><input name="handoffRequired" type="checkbox"> 需要人工</label>
            <label class="checkbox-row"><input name="enabled" type="checkbox" checked> 启用</label>
            <div class="form-actions modal-actions">
                <button class="button primary" type="submit">保存规则</button>
                <button class="button secondary" type="button" id="clearQaRuleBtn">取消</button>
            </div>
        </form>
    </section>
</div>
<dialog id="actionDialog" class="action-dialog">
    <form id="actionDialogForm" method="dialog">
        <h3 id="actionDialogTitle"></h3>
        <div id="actionDialogBody" class="action-dialog-body"></div>
        <div class="action-dialog-footer">
            <button type="button" class="button secondary" data-action="action-dialog-cancel">取消</button>
            <button type="submit" class="button primary">确认</button>
        </div>
    </form>
</dialog>
<script src="app.js?v=20260604-qa-modal"></script>
</body>
</html>
