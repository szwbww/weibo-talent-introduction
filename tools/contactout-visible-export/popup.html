<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>已显示邮箱采集</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><h1>已显示邮箱采集</h1><p>完整邮箱全部保留 · 掩码邮箱自动跳过</p></header>
  <div class="actions"><button id="mark">标红可忽略专家</button><button id="unmark">取消标红</button></div>
  <p class="hint">按已保存规则核对可见当前职务，无需显示邮箱。未标红不代表合格。</p>
  <details id="online-panel"><summary>自动企业评分</summary>
    <p class="hint"><label><input id="online-enabled" type="checkbox"> 自动查询企业并选择找人门槛</label></p>
    <label for="online-deepseek-key">DeepSeek API Key</label>
    <input id="online-deepseek-key" type="password" autocomplete="off" spellcheck="false">
    <label for="online-tavily-key">Tavily API Key</label>
    <input id="online-tavily-key" type="password" autocomplete="off" spellcheck="false">
    <p class="hint">密钥以本机明文形式保存于 Dia 扩展存储；不会上传到 ContactOut、导出文件或本机以外的位置。</p>
    <label for="online-company">当前企业（未识别时填写，每行一家）</label>
    <textarea id="online-company" rows="2" spellcheck="false"></textarea>
    <div class="actions"><button id="online-save">保存直连配置</button><button id="online-refresh">重新联网查询</button></div>
    <p id="online-status" class="hint" role="status" aria-live="polite"></p>
    <div id="online-results"></div>
  </details>
  <details id="rules-panel"><summary>编辑岗位与企业规则</summary>
    <p class="hint">岗位与企业配置分别保存；导入／恢复只填编辑框，点击对应保存按钮后才生效。</p>
    <label for="rules-json">岗位门槛 JSON</label><textarea id="rules-json" rows="10" spellcheck="false"></textarea>
    <div class="actions"><button id="save-rules">保存并应用规则</button><button id="reset-rules">恢复默认到编辑框</button></div>
    <div class="actions"><button id="export-rules">导出已保存规则</button><button id="import-rules">导入 JSON</button></div>
    <input id="rules-file" type="file" accept=".json,application/json" hidden>
    <label for="enterprise-json">企业评分库 JSON</label><textarea id="enterprise-json" rows="10" spellcheck="false"></textarea>
    <div class="actions"><button id="save-enterprises">保存并应用企业评分</button><button id="reset-enterprises">清空企业编辑框</button></div>
    <div class="actions"><button id="export-enterprises">导出已保存企业评分</button><button id="import-enterprises">导入企业 JSON</button></div>
    <input id="enterprise-file" type="file" accept=".json,application/json" hidden>
  </details>
  <button id="capture" class="primary">采集当前页已显示邮箱</button>
  <p class="hint">自动展开已显示邮箱专家的 more，再采集履历。请保持窗口打开至完成；翻页后再采集，已有记录会合并。</p>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="summary"><strong id="people">0 人</strong><span id="emails">0 个邮箱</span></div>
  <div class="actions"><button id="csv">导出 CSV</button><button id="json">导出 JSON</button></div>
  <section id="preview" aria-label="采集预览"></section>
  <footer><span>资料保存在本机浏览器。字段待核对，未分类邮箱。</span><button id="clear">清空本地名单</button></footer>
  <script src="core.js"></script><script src="research.js"></script><script src="popup.js"></script>
</body></html>
